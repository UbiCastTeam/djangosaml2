[tox]
envlist =
    py3.13-django6.1

[testenv]
commands =
    pip list
    python tests/run_tests.py

deps =
    django6.1: django~=6.1.3
    djangomaster: https://github.com/django/django/archive/master.tar.gz
    .

ignore_outcome =
    djangomaster: True

setenv =
    PYTHONWARNINGS=module::DeprecationWarning
